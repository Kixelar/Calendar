name: calendar
description: "Calendar for Android with Google Calendar sync, Nothing-inspired design."
publish_to: 'none'
# Date version (docs/WORKFLOW.md). Part after + is the Android versionCode: 30000000 + minutes since 2026-01-01 UTC.
version: 2026.11.1-dev+30438741

environment:
  sdk: ^3.13.5

dependencies:
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  file_picker: ^13.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # Mockup fonts. Ndot and NType82 lack Polish letters: those glyphs fall back to Space Mono / Space Grotesk (lib/theme.dart).
  fonts:
    - family: Ndot
      fonts: [{asset: assets/fonts/Ndot57-Regular.otf}]
    - family: NType82
      fonts: [{asset: assets/fonts/NType82-Regular.otf}]
    - family: Lettera Mono
      fonts: [{asset: assets/fonts/LetteraMonoLL-Regular.otf}]
    - family: Space Grotesk
      fonts: [{asset: assets/fonts/SpaceGrotesk-Regular.otf}]
    - family: Space Mono
      fonts: [{asset: assets/fonts/SpaceMono-Regular.otf}]
